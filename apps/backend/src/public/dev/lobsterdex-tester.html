<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lobsterdex Design Tester</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0f;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    h1 { color: #6366f1; margin-bottom: 10px; }
    .subtitle { color: #888; margin-bottom: 20px; }

    /* Theme selector */
    .theme-selector {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .theme-btn {
      padding: 10px 20px;
      background: #1e1e2e;
      border: 2px solid #333;
      border-radius: 8px;
      color: #888;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .theme-btn:hover { border-color: #6366f1; color: #fff; }
    .theme-btn.active { border-color: #6366f1; background: rgba(99,102,241,0.2); color: #fff; }

    /* Action buttons */
    .action-btns {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }

    .action-btn {
      padding: 12px 24px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .action-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(99,102,241,0.4); }
    .action-btn.secondary { background: #333; }

    /* ========================================
       BOOK - 3D container
    ======================================== */
    .book {
      width: 600px;
      height: 400px;
      position: relative;
      perspective: 1500px;
      cursor: pointer;
      transform: translateX(-150px);
      transition: transform 0.6s ease-in-out;
    }

    .book.open {
      transform: translateX(0);
    }

    /* ========================================
       RIGHT PAGE - Under the cover
    ======================================== */
    .page-right {
      position: absolute;
      top: 0;
      right: 0;
      width: 300px;
      height: 400px;
      background: linear-gradient(145deg, #dc2626, #b91c1c);
      border-radius: 0 12px 12px 0;
      box-shadow: inset 5px 0 15px rgba(0,0,0,0.3);
      padding: 15px;
      display: flex;
      flex-direction: column;
    }

    /* Right page - big screen */
    .right-screen {
      flex: 1;
      background: #1f2937;
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 10px;
      box-shadow: inset 2px 2px 6px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      overflow: visible;
    }

    .screen-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      margin-bottom: 8px;
    }

    .type-name {
      font-family: 'Courier New', monospace;
      font-size: 14px;
      font-weight: bold;
      color: #4ade80;
      margin-bottom: 2px;
    }

    .type-matchups {
      font-family: 'Courier New', monospace;
      font-size: 9px;
      color: #22c55e;
      line-height: 1.3;
    }

    .panel-title {
      font-family: 'Courier New', monospace;
      font-size: 14px;
      font-weight: bold;
      color: #4ade80;
      margin-bottom: 8px;
    }

    /* Right page - type grid */
    .type-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      overflow: visible;
      padding: 2px;
    }

    .type-btn {
      height: 28px;
      border: none;
      border-radius: 4px;
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      cursor: pointer;
      box-shadow: 0 2px 0 rgba(0,0,0,0.3);
      transition: all 0.1s;
    }

    .type-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .type-btn:active { transform: translateY(1px); box-shadow: 0 1px 0 rgba(0,0,0,0.3); }
    .type-btn.active { box-shadow: 0 0 0 2px #fff, 0 2px 0 rgba(0,0,0,0.3); }

    /* Type colors */
    .type-btn.neutral { background: #A8A878; }
    .type-btn.fire { background: #F08030; }
    .type-btn.water { background: #6890F0; }
    .type-btn.electric { background: #F8D030; color: #333; }
    .type-btn.grass { background: #78C850; }
    .type-btn.ice { background: #98D8D8; color: #333; }
    .type-btn.martial { background: #C03028; }
    .type-btn.venom { background: #A040A0; }
    .type-btn.earth { background: #E0C068; color: #333; }
    .type-btn.air { background: #A890F0; }
    .type-btn.psyche { background: #F85888; }
    .type-btn.insect { background: #A8B820; color: #333; }
    .type-btn.stone { background: #B8A038; }
    .type-btn.ghost { background: #705898; }
    .type-btn.dragon { background: #7038F8; }
    .type-btn.shadow { background: #705848; }
    .type-btn.metal { background: #B8B8D0; color: #333; }
    .type-btn.mystic { background: #EE99AC; color: #333; }

    /* Right page - nav buttons */
    .nav-buttons {
      display: flex;
      gap: 8px;
    }

    .nav-btn {
      flex: 1;
      height: 28px;
      background: #e5e7eb;
      border: none;
      border-radius: 14px;
      color: #374151;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 0 #9ca3af;
      transition: all 0.1s;
    }

    .nav-btn:active { transform: translateY(1px); box-shadow: 0 1px 0 #9ca3af; }
    .nav-btn.active { background: #6366f1; color: #fff; box-shadow: 0 2px 0 #4338ca; }

    /* Content panels */
    .content-panel {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 10px;
    }

    /* Moves list */
    .moves-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow-y: auto;
      flex: 1;
    }

    .move-item {
      background: rgba(0,0,0,0.2);
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 9px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
      position: relative;
    }

    .move-name { font-weight: 600; flex: 1; }
    .move-power { color: #fbbf24; font-size: 8px; }

    .move-info-btn {
      width: 14px;
      height: 14px;
      background: rgba(255,255,255,0.2);
      border: none;
      border-radius: 50%;
      color: #fff;
      font-size: 8px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .move-info-btn:hover {
      background: rgba(255,255,255,0.4);
    }

    .move-info-box {
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 4px;
      padding: 6px 8px;
      font-size: 9px;
      color: #94a3b8;
      line-height: 1.4;
      margin-top: 6px;
      min-height: 18px;
    }

    /* Natures list */
    .natures-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 3px;
      overflow-y: auto;
      flex: 1;
    }

    .nature-item {
      background: rgba(0,0,0,0.2);
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 8px;
      color: #fff;
      text-align: center;
    }

    .nature-name { font-weight: 600; }
    .nature-effect { color: #86efac; font-size: 7px; }

    /* ========================================
       COVER - Has front and back faces
    ======================================== */
    .cover {
      position: absolute;
      top: 0;
      left: 300px;
      width: 300px;
      height: 400px;
      z-index: 10;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 0.6s ease-in-out;
    }

    .book.open .cover {
      transform: rotateY(-180deg);
    }

    /* Front of cover (LOBSTERDEX) */
    .cover-front {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(145deg, #dc2626, #b91c1c);
      border-radius: 0 12px 12px 0;
      backface-visibility: hidden;
      box-shadow: 5px 0 20px rgba(0,0,0,0.4);
      overflow: hidden;
    }

    /* Blue lens */
    .cover-lens {
      position: absolute;
      top: 25px;
      left: 25px;
      width: 70px;
      height: 70px;
      background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 50%, #1d4ed8 100%);
      border-radius: 50%;
      border: 5px solid #f5f5f5;
      box-shadow:
        inset 3px 3px 10px rgba(255,255,255,0.5),
        inset -2px -2px 8px rgba(0,0,0,0.3),
        0 4px 15px rgba(0,0,0,0.4);
    }

    .cover-lens::after {
      content: '';
      position: absolute;
      top: 10px;
      left: 10px;
      width: 20px;
      height: 20px;
      background: rgba(255,255,255,0.6);
      border-radius: 50%;
    }


    /* Title section */
    .cover-title-section {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      transform: translateY(-50%);
      text-align: center;
    }

    .cover-line {
      height: 3px;
      background: rgba(0,0,0,0.15);
      margin: 0 20px;
    }

    .cover-title {
      font-size: 28px;
      font-weight: 900;
      color: rgba(255,255,255,0.95);
      letter-spacing: 4px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
      padding: 15px 0;
    }

    /* Click hint */
    .cover-hint {
      position: absolute;
      bottom: 25px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 13px;
      color: rgba(255,255,255,0.5);
    }

    /* Back of cover (LEFT PAGE - visible when flipped) */
    .cover-back {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(145deg, #dc2626, #b91c1c);
      border-radius: 12px 0 0 12px;
      backface-visibility: hidden;
      transform: rotateY(180deg);
      box-shadow: inset -5px 0 15px rgba(0,0,0,0.3);
      padding: 15px;
      display: flex;
      flex-direction: column;
    }

    /* Left page - screen frame */
    .screen-frame {
      background: #9ca3af;
      border-radius: 8px;
      padding: 6px;
      box-shadow: inset 2px 2px 6px rgba(0,0,0,0.3);
      margin-bottom: 10px;
    }

    .screen {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: linear-gradient(180deg, #059669 0%, #047857 100%);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
      overflow: hidden;
    }

    .screen img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
    }

    /* Left page - variant thumbnails */
    .variant-row {
      display: flex;
      gap: 5px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .variant-thumb {
      width: 38px;
      height: 38px;
      background: #6b7280;
      border-radius: 4px;
      padding: 2px;
      cursor: pointer;
      box-shadow: 0 2px 0 rgba(0,0,0,0.3);
      transition: all 0.1s;
      position: relative;
    }

    .variant-thumb:hover {
      transform: translateY(-1px);
      background: #9ca3af;
    }

    .variant-thumb.active {
      background: #9ca3af;
      box-shadow: 0 0 0 2px #fff, 0 2px 0 rgba(0,0,0,0.3);
    }

    .variant-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 2px;
    }

    .variant-label {
      position: absolute;
      bottom: -14px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 7px;
      color: rgba(255,255,255,0.7);
      white-space: nowrap;
    }

    /* ========================================
       STATUS
    ======================================== */
    .status {
      margin-top: 30px;
      color: #888;
      font-size: 14px;
    }
    .status strong { color: #fff; }
  </style>
</head>
<body>
  <h1>Lobsterdex Design Tester</h1>
  <p class="subtitle">Click to open/close. Two pages: lobster on left, types on right.</p>

  <div class="theme-selector">
    <button class="theme-btn active" data-theme="classic">Classic Red</button>
    <button class="theme-btn" data-theme="purple">ClawCombat Purple</button>
    <button class="theme-btn" data-theme="cyber">Cyberpunk Dark</button>
  </div>

  <div class="action-btns">
    <button class="action-btn" id="toggleBtn">Toggle Open/Close</button>
    <button class="action-btn secondary" id="closeBtn">Close</button>
  </div>

  <div class="book" id="book">
    <!-- Right page (revealed when cover flips) -->
    <div class="page-right">
      <div class="right-screen">
        <!-- TYPES panel -->
        <div class="screen-panel" id="panelTypes">
          <div class="panel-header">
            <div class="type-name" id="typeName">Fire Type</div>
            <div class="type-matchups" id="typeMatchups">Strong vs: Grass, Ice, Insect<br>Weak vs: Water, Stone, Dragon</div>
          </div>
          <div class="type-grid" id="typeGrid"></div>
        </div>

        <!-- MOVES panel -->
        <div class="screen-panel" id="panelMoves" style="display:none;">
          <div class="panel-title">Moves</div>
          <div class="moves-list" id="movesList"></div>
          <div class="move-info-box" id="moveInfoBox">Hover over <span style="color:#fbbf24">i</span> for move info</div>
        </div>

        <!-- NATURES panel -->
        <div class="screen-panel" id="panelNatures" style="display:none;">
          <div class="natures-list" id="naturesList"></div>
        </div>
      </div>

      <div class="nav-buttons">
        <button class="nav-btn active" data-panel="types">TYPES</button>
        <button class="nav-btn" data-panel="moves">MOVES</button>
        <button class="nav-btn" data-panel="natures">NATURES</button>
      </div>
    </div>

    <!-- Cover with front and back -->
    <div class="cover">
      <div class="cover-front">
        <div class="cover-lens"></div>
        <div class="cover-title-section">
          <div class="cover-line"></div>
          <div class="cover-title">LOBSTERDEX</div>
          <div class="cover-line"></div>
        </div>
        <div class="cover-hint">Click to open</div>
      </div>
      <div class="cover-back">
        <div class="screen-frame">
          <div class="screen">
            <img id="lobsterImage" src="/references/fire/cadet-balanced.webp" alt="Lobster">
          </div>
        </div>
        <div class="variant-row" id="variantRow"></div>
      </div>
    </div>
  </div>

  <p class="status">Design: <strong id="designName">Classic Red</strong> | State: <strong id="state">Closed</strong></p>

  <script>
    const book = document.getElementById('book');
    const state = document.getElementById('state');
    const designName = document.getElementById('designName');
    const toggleBtn = document.getElementById('toggleBtn');
    const closeBtn = document.getElementById('closeBtn');

    function toggleBook() {
      book.classList.toggle('open');
      state.textContent = book.classList.contains('open') ? 'Open' : 'Closed';
    }

    function closeBook() {
      book.classList.remove('open');
      state.textContent = 'Closed';
    }

    book.addEventListener('click', toggleBook);
    toggleBtn.addEventListener('click', toggleBook);
    closeBtn.addEventListener('click', closeBook);

    // Theme selector
    document.querySelectorAll('.theme-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const names = { classic: 'Classic Red', purple: 'ClawCombat Purple', cyber: 'Cyberpunk Dark' };
        designName.textContent = names[btn.dataset.theme];
      });
    });

    // Type data
    const TYPES = [
      'neutral', 'fire', 'water', 'electric', 'grass', 'ice',
      'martial', 'venom', 'earth', 'air', 'psyche', 'insect',
      'stone', 'ghost', 'dragon', 'shadow', 'metal', 'mystic'
    ];

    const TYPE_MATCHUPS = {
      neutral: { strong: 'None', weak: 'Martial' },
      fire: { strong: 'Grass, Ice, Insect, Metal', weak: 'Water, Stone, Dragon' },
      water: { strong: 'Fire, Earth, Stone', weak: 'Electric, Grass' },
      electric: { strong: 'Water, Air', weak: 'Earth' },
      grass: { strong: 'Water, Earth, Stone', weak: 'Fire, Ice, Venom, Air, Insect' },
      ice: { strong: 'Grass, Earth, Air, Dragon', weak: 'Fire, Martial, Stone' },
      martial: { strong: 'Neutral, Ice, Stone, Shadow, Metal', weak: 'Air, Psyche, Mystic' },
      venom: { strong: 'Grass, Mystic', weak: 'Earth, Psyche' },
      earth: { strong: 'Fire, Electric, Venom, Stone', weak: 'Water, Grass, Ice' },
      air: { strong: 'Grass, Martial, Insect', weak: 'Electric, Ice, Stone' },
      psyche: { strong: 'Martial, Venom', weak: 'Insect, Ghost, Shadow' },
      insect: { strong: 'Grass, Psyche, Shadow', weak: 'Fire, Air, Stone' },
      stone: { strong: 'Fire, Ice, Air, Insect', weak: 'Water, Grass, Martial, Earth' },
      ghost: { strong: 'Psyche, Ghost', weak: 'Shadow' },
      dragon: { strong: 'Dragon', weak: 'Ice, Dragon, Mystic' },
      shadow: { strong: 'Psyche, Ghost', weak: 'Martial, Insect, Mystic' },
      metal: { strong: 'Ice, Stone, Mystic', weak: 'Fire, Martial, Earth' },
      mystic: { strong: 'Martial, Dragon, Shadow', weak: 'Venom, Metal' }
    };

    let selectedType = 'fire';

    // Populate type grid
    const typeGrid = document.getElementById('typeGrid');
    TYPES.forEach(type => {
      const btn = document.createElement('button');
      btn.className = `type-btn ${type}${type === selectedType ? ' active' : ''}`;
      btn.textContent = type.toUpperCase();
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        selectType(type);
      });
      typeGrid.appendChild(btn);
    });

    function selectType(type) {
      selectedType = type;
      selectedVariant = 'cadet-balanced'; // Reset to balanced when changing type
      // Update active button
      document.querySelectorAll('.type-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.toLowerCase() === type);
      });
      // Update image
      document.getElementById('lobsterImage').src = `/references/${type}/cadet-balanced.webp`;
      // Update info
      updateTypeInfo(type);
      // Update moves list
      updateMovesList(type);
      // Update variant thumbnails
      updateVariants(type);
    }

    function updateTypeInfo(type) {
      const displayName = type.charAt(0).toUpperCase() + type.slice(1);
      document.getElementById('typeName').textContent = displayName + ' Type';
      const matchup = TYPE_MATCHUPS[type];
      document.getElementById('typeMatchups').innerHTML =
        `Strong vs: ${matchup.strong}<br>Weak vs: ${matchup.weak}`;
    }

    // Moves data with descriptions
    const TYPE_MOVES = {
      fire: [
        { name: 'Ember', power: 40, desc: 'A small flame attack. May cause burn.' },
        { name: 'Flame Burst', power: 70, desc: 'Flames burst and hit nearby foes.' },
        { name: 'Fire Blast', power: 110, desc: 'Intense fire attack. 10% burn chance.' },
        { name: 'Inferno', power: 100, desc: 'Engulfs foe in flames. Always burns.' },
        { name: 'Flamethrower', power: 90, desc: 'Reliable fire beam. 10% burn.' },
        { name: 'Heat Wave', power: 95, desc: 'Hot wind hits all foes.' },
        { name: 'Fire Punch', power: 75, desc: 'Fiery punch. May cause burn.' },
        { name: 'Lava Plume', power: 80, desc: 'Scarlet flames. 30% burn chance.' }
      ],
      water: [
        { name: 'Bubble', power: 40, desc: 'Shoots bubbles. May lower speed.' },
        { name: 'Water Pulse', power: 60, desc: 'Ultrasonic wave. May confuse.' },
        { name: 'Hydro Pump', power: 110, desc: 'Powerful water blast.' },
        { name: 'Surf', power: 90, desc: 'Giant wave hits all foes.' },
        { name: 'Aqua Tail', power: 90, desc: 'Swings tail like a wave.' },
        { name: 'Scald', power: 80, desc: 'Hot water. 30% burn chance.' },
        { name: 'Waterfall', power: 80, desc: 'Charges with water. May flinch.' },
        { name: 'Rain Dance', power: 0, desc: 'Summons rain for 5 turns.' }
      ],
      grass: [
        { name: 'Vine Whip', power: 45, desc: 'Strikes with vines.' },
        { name: 'Razor Leaf', power: 55, desc: 'Sharp leaves. High crit rate.' },
        { name: 'Solar Beam', power: 120, desc: 'Charges sun, then fires.' },
        { name: 'Leaf Storm', power: 130, desc: 'Powerful but lowers Sp.Atk.' },
        { name: 'Giga Drain', power: 75, desc: 'Drains HP from the foe.' },
        { name: 'Seed Bomb', power: 80, desc: 'Hard seeds barrage foe.' },
        { name: 'Energy Ball', power: 90, desc: 'Nature power. May lower Sp.Def.' },
        { name: 'Leaf Blade', power: 90, desc: 'Sharp leaf. High crit rate.' }
      ],
      electric: [
        { name: 'Thunder Shock', power: 40, desc: 'Electric jolt. May paralyze.' },
        { name: 'Spark', power: 65, desc: 'Electric tackle. May paralyze.' },
        { name: 'Thunderbolt', power: 90, desc: 'Strong shock. 10% paralyze.' },
        { name: 'Thunder', power: 110, desc: 'Lightning strike. 30% paralyze.' },
        { name: 'Volt Switch', power: 70, desc: 'Attack then switch out.' },
        { name: 'Wild Charge', power: 90, desc: 'Reckless charge. Has recoil.' },
        { name: 'Discharge', power: 80, desc: 'Hits all nearby. May paralyze.' },
        { name: 'Thunder Wave', power: 0, desc: 'Weak shock that paralyzes.' }
      ],
      ice: [
        { name: 'Powder Snow', power: 40, desc: 'Icy snow. May freeze.' },
        { name: 'Ice Beam', power: 90, desc: 'Freezing beam. 10% freeze.' },
        { name: 'Blizzard', power: 110, desc: 'Howling blizzard. May freeze.' },
        { name: 'Freeze Dry', power: 70, desc: 'Super effective on Water.' },
        { name: 'Ice Punch', power: 75, desc: 'Icy fist. May freeze.' },
        { name: 'Icicle Crash', power: 85, desc: 'Ice drop. May flinch.' },
        { name: 'Aurora Beam', power: 65, desc: 'Rainbow beam. May lower Atk.' },
        { name: 'Hail', power: 0, desc: 'Summons hail for 5 turns.' }
      ],
      neutral: [
        { name: 'Tackle', power: 40, desc: 'Basic charging attack.' },

    function updateMovesList(type) {
      const moves = TYPE_MOVES[type] || [];
      // Sort by power: highest first, status (0 power) at bottom
      const sorted = [...moves].sort((a, b) => {
        if (a.power === 0 && b.power === 0) return 0;
        if (a.power === 0) return 1;
        if (b.power === 0) return -1;
        return b.power - a.power;
      });
      const list = document.getElementById('movesList');
      const infoBox = document.getElementById('moveInfoBox');
      list.innerHTML = sorted.map(move => `
        <div class="move-item">
          <span class="move-name">${move.name}</span>
          <span class="move-power">${move.power > 0 ? 'PWR ' + move.power : 'Status'}</span>
          <button class="move-info-btn" data-desc="${move.desc}" tabindex="0">i</button>
        </div>
      `).join('');

      // Add hover listeners to info buttons
      list.querySelectorAll('.move-info-btn').forEach(btn => {
        btn.addEventListener('mouseenter', (e) => {
          e.stopPropagation();
          infoBox.textContent = btn.dataset.desc;
          infoBox.style.color = '#e2e8f0';
        });
        btn.addEventListener('mouseleave', () => {
          infoBox.innerHTML = 'Hover over <span style="color:#fbbf24">i</span> for move info';
          infoBox.style.color = '#94a3b8';
        });
      });
    }

    // Variants data
    const VARIANTS = ['cadet-balanced', 'cadet-attack', 'cadet-defense', 'cadet-speed', 'cadet-claw', 'cadet-shell'];
    const VARIANT_NAMES = ['Balanced', 'Striker', 'Tank', 'Swift', 'Claw', 'Shell'];
    let selectedVariant = 'cadet-balanced';

    function updateVariants(type) {
      const row = document.getElementById('variantRow');
      row.innerHTML = VARIANTS.map((v, i) => `
        <div class="variant-thumb${v === selectedVariant ? ' active' : ''}" data-variant="${v}">
          <img src="/references/${type}/${v}.webp" alt="${VARIANT_NAMES[i]}" onerror="this.style.display='none'">
        </div>
      `).join('');

      row.querySelectorAll('.variant-thumb').forEach(thumb => {
        thumb.addEventListener('click', (e) => {
          e.stopPropagation();
          selectedVariant = thumb.dataset.variant;
          document.querySelectorAll('.variant-thumb').forEach(t => t.classList.remove('active'));
          thumb.classList.add('active');
          document.getElementById('lobsterImage').src = `/references/${selectedType}/${selectedVariant}.webp`;
        });
      });
    }

    // Initialize variants
    updateVariants(selectedType);

    });

    // Initialize moves list
    updateMovesList(selectedType);

    // Panel switching
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        // Update active button
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        // Show correct panel
        const panel = btn.dataset.panel;
        document.getElementById('panelTypes').style.display = panel === 'types' ? 'block' : 'none';
        document.getElementById('panelMoves').style.display = panel === 'moves' ? 'block' : 'none';
        document.getElementById('panelNatures').style.display = panel === 'natures' ? 'block' : 'none';
